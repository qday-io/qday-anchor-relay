name: Publish images

# Builds and pushes the relay + portal images to GHCR, following the team's
# deploy convention (server compose pulls ghcr.io/<org>/<image>:testnet and a
# cron script re-ups on digest change — see deploy/server/).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-pushed release

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image names follow the org convention (one image per component).
  RELAY_IMAGE: ${{ github.repository_owner }}/qday-anchor-relay
  PORTAL_IMAGE: ${{ github.repository_owner }}/qday-anchor-portal

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Server runs linux/amd64 (see deploy/server/compose.yml).
      - name: Build and push relay
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.RELAY_IMAGE }}:testnet
            ${{ env.REGISTRY }}/${{ env.RELAY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Build and push portal
        uses: docker/build-push-action@v6
        with:
          context: portal
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PORTAL_IMAGE }}:testnet
            ${{ env.REGISTRY }}/${{ env.PORTAL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
