# Server 部署用 compose（照團隊 GHCR 部署慣例）。
# 用法：
#   1. 放到 ~/deploy/qday-anchor-relay/compose.yml
#   2. 同目錄放 .env（照 repo 根目錄 .env.example 填）與 initdb/01-portal-ro.sh
#   3. docker compose up -d
#   4. scripts/update_anchor_relay.sh 掛 cron 自動追新 image
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anchor}
      POSTGRES_USER: ${POSTGRES_USER:-anchor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PORTAL_DB_USER: ${PORTAL_DB_USER:-portal_ro}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anchor} -d ${POSTGRES_DB:-anchor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations 內嵌在 relay binary，啟動時自動套用（冪等）——
  # server 端不需要任何 migrate service 或 migrations 目錄。
  relay:
    image: ghcr.io/qday-io/qday-anchor-relay:testnet
    platform: linux/amd64
    restart: always
    container_name: qday-anchor-relay
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RELAY_ADMIN_ADDR: ":8081" # 內部網路限定，不對外
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    image: ghcr.io/qday-io/qday-anchor-portal:testnet
    platform: linux/amd64
    restart: always
    container_name: qday-anchor-portal
    # 唯一對外的容器：不給整包 .env，只給需要的（機密不外流）
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-anchor}
      PORTAL_DB_USER: ${PORTAL_DB_USER:-portal_ro}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ABEL_EXPLORER_BASE: ${ABEL_EXPLORER_BASE:-}
      DA_EXPLORER_BASE: ${DA_EXPLORER_BASE:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RELAY_ADMIN_URL: http://relay:8081
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
