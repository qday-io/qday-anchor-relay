services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anchor}
      POSTGRES_USER: ${POSTGRES_USER:-anchor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PORTAL_DB_USER: ${PORTAL_DB_USER:-portal_ro}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anchor} -d ${POSTGRES_DB:-anchor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./relay/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-anchor}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-anchor}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    build:
      context: ./relay
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RELAY_ADMIN_ADDR: ":8081" # container network only; never published
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  portal:
    build:
      context: ./portal
    # Deliberately NO env_file: the portal is the only internet-facing
    # container and must not receive relay secrets (wallet mnemonic, relayer
    # private key). Only what it needs, interpolated from .env:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-anchor}
      PORTAL_DB_USER: ${PORTAL_DB_USER:-portal_ro}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ABEL_EXPLORER_BASE: ${ABEL_EXPLORER_BASE:-}
      DA_EXPLORER_BASE: ${DA_EXPLORER_BASE:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RELAY_ADMIN_URL: http://relay:8081
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
